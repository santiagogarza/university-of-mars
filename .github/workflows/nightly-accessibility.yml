name: Nightly accessibility check

on:
  schedule:
    # 10:00 UTC. About 3:00 AM Pacific during daylight time, 2:00 AM during standard time.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Scan main pages and write the job summary
        run: node scripts/accessibility-report.mjs
